name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: node apps/cli/dist/main.js
      - name: Built S0 CLI deterministic smoke
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          const args = ['apps/cli/dist/main.js', 'run', '--scenario', 'initial-two-cities', '--seed', '42', '--ticks', '100'];
          const first = spawnSync(process.execPath, args, { encoding: 'utf8' });
          const second = spawnSync(process.execPath, args, { encoding: 'utf8' });
          assert.equal(first.status, 0, first.stderr);
          assert.equal(second.status, 0, second.stderr);
          assert.equal(first.stdout, second.stdout, 'repeated built CLI output differs');
          assert.match(first.stdout, /State hash: [a-f0-9]{64}/);
          assert.match(first.stdout, /Event hash: [a-f0-9]{64}/);
          const invalid = spawnSync(process.execPath, ['apps/cli/dist/main.js', 'run', '--scenario', 'initial-two-cities', '--ticks', '0'], { encoding: 'utf8' });
          assert.notEqual(invalid.status, 0, 'invalid CLI input unexpectedly succeeded');
          console.log(first.stdout);
          NODE
      - name: Built VS CLI 1000-tick smoke
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          const args = ['apps/cli/dist/main.js', 'run', '--scenario', 'vertical-slice', '--seed', '42', '--ticks', '1000'];
          const result = spawnSync(process.execPath, args, { encoding: 'utf8', timeout: 1800000 });
          const repeated = spawnSync(process.execPath, args, { encoding: 'utf8', timeout: 1800000 });
          assert.equal(result.status, 0, result.error?.message ?? result.stderr);
          assert.equal(repeated.status, 0, repeated.error?.message ?? repeated.stderr);
          assert.equal(result.stdout, repeated.stdout, '1000-tick built VS CLI reports differ');
          assert.match(result.stdout, /fixture v1/);
          assert.match(result.stdout, /1000 ticks/);
          assert.match(result.stdout, /funded intervention paid \(10 coin debited\)/);
          assert.match(result.stdout, /AI accept/);
          assert.match(result.stdout, /1 departed, 1 arrived; freight paid 3 from funded benefit true/);
          assert.match(result.stdout, /money balanced true/);
          assert.match(result.stdout, /State hash: [a-f0-9]{64}/);
          assert.match(result.stdout, /Event hash: [a-f0-9]{64}/);
          console.log(result.stdout);
          NODE
      - run: node --input-type=module -e "import { createWorld } from '@epcse/simulation-core'; if (createWorld('ci').run(2).tick !== 2) process.exit(1)"
      - name: Built three-nations M1 CLI 1000-tick smoke
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          const args = ['apps/cli/dist/main.js', 'run', '--scenario', 'three-nations-trade-and-politics', '--seed', '42', '--ticks', '1000'];
          const first = spawnSync(process.execPath, args, { encoding: 'utf8', timeout: 1800000 });
          const second = spawnSync(process.execPath, args, { encoding: 'utf8', timeout: 1800000 });
          assert.equal(first.status, 0, first.error?.message ?? first.stderr);
          assert.equal(second.status, 0, second.error?.message ?? second.stderr);
          assert.equal(first.stdout, second.stdout, 'repeated built three-nations CLI output differs');
          assert.match(first.stdout, /fixture v1/);
          assert.match(first.stdout, /kingdoms 3; cities 12; goods 15; sectors 6; classes 5/);
          assert.match(first.stdout, /Reconciliation: .*: true/);
          assert.match(first.stdout, /money conserved true/);
          assert.match(first.stdout, /State hash: [a-f0-9]{64}/);
          console.log(first.stdout);
          NODE
